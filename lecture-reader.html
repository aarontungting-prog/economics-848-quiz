<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>講義筆記</title><link rel="stylesheet" href="lecture-reader.css"></head>
<body>
<header class="readerTop"><a class="readerLogo" href="lectures.html">E</a><div class="readerTitle"><b id="docTitle">載入講義…</b><span id="pageReadout">—</span></div><div class="readerGrow"></div><span class="syncLamp pending" id="syncLamp"><i></i><span>初始化中…</span></span><button class="iconBtn" id="saveBtn" title="儲存筆記">儲存</button><button class="iconBtn" id="shareBtn" title="分享閱讀連結">分享</button><a class="iconBtn" href="lectures.html">返回</a></header>
<section class="readerTools" aria-label="講義筆記工具列"><button data-tool="select" class="tool active" title="選取／移動">↖</button><button data-tool="pen" class="tool" title="畫筆">✎</button><button data-tool="highlighter" class="tool" title="螢光筆">▰</button><button data-tool="eraser" class="tool" title="橡皮擦">⌫</button><button data-tool="text" class="tool" title="新增文字">T</button><span class="sep"></span><input id="color" type="color" value="#17324d" title="顏色"><label class="widthLabel">粗細 <input id="width" type="range" min="1" max="18" value="3"></label><label class="widthLabel">字級 <input id="textSize" type="range" min="10" max="36" value="16"></label><button id="bold" class="tool" title="粗體">B</button><span class="sep"></span><button id="undo" class="tool" title="復原">↶</button><button id="redo" class="tool" title="重做">↷</button><button id="clearPage" class="tool danger" title="清除目前頁筆記">清除此頁</button><button id="clearAll" class="tool danger" title="清除整份講義筆記">清除整份</button><button id="exportImage" class="tool" title="匯出目前頁圖片">匯出圖片</button><button id="exportPdf" class="tool" title="匯出目前頁 PDF">匯出 PDF</button></section>
<section class="readerNav"><button id="prev">← 上一頁</button><label>頁碼 <input id="pageInput" inputmode="numeric" type="number" min="1" value="1"></label><button id="next">下一頁 →</button><button id="zoomOut">−</button><span id="zoomReadout">100%</span><button id="zoomIn">＋</button><form id="searchForm"><input id="searchInput" placeholder="搜尋講義文字"><button>搜尋</button></form><span id="searchResult"></span></section>
<main class="readerMain"><div id="emptyState" class="emptyState hidden"></div><div id="pageShell" class="pageShell"><canvas id="pdfCanvas"></canvas><canvas id="inkCanvas" aria-label="在講義頁面書寫"></canvas><div id="textLayer" aria-label="文字筆記"></div></div></main>
<dialog id="shareDialog"><form method="dialog"><h2>分享講義與筆記</h2><p id="shareText">建立一個唯讀分享連結後，知道連結的人可以看到此講義與目前已同步的筆記。</p><input id="shareUrl" readonly><div class="dialogActions"><button value="cancel">關閉</button><button type="button" id="copyShare" class="primary">複製連結</button></div></form></dialog>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script type="module" src="lecture-reader.js?v=20260923c"></script>
</body></html>

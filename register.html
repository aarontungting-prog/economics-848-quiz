<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>經濟學題庫｜註冊</title>
<style>
:root{--ink:#183342;--muted:#6c7f89;--line:#d9e6ea;--p:#2f8091;--soft:#edf8fa;--bad:#b74f4b}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;background:linear-gradient(135deg,#eef9fb,#fffaf2)}.top{padding:20px 24px}.topin{max-width:1080px;margin:auto;display:flex;align-items:center;gap:11px}.logo{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:var(--p);color:#fff;font-weight:900;font-size:21px}.brand{font-weight:850}.grow{flex:1}.back{color:var(--p);text-decoration:none;font-size:14px}.wrap{max-width:520px;margin:5vh auto;padding:24px}.card{border:1px solid var(--line);border-radius:24px;background:#ffffffdf;box-shadow:0 18px 55px #1f526018;padding:32px}.kicker{color:var(--p);font-size:12px;font-weight:900;letter-spacing:.16em}.card h1{font-size:31px;margin:12px 0 8px}.sub{color:var(--muted);line-height:1.7;margin:0 0 22px}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:13px;font-weight:800}.field input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit}.field input:focus{outline:3px solid #bfe5ea;border-color:var(--p)}.btn{width:100%;min-height:44px;border:0;border-radius:12px;background:var(--p);color:#fff;font:inherit;font-weight:800;cursor:pointer;margin-top:10px}.status{min-height:24px;margin-top:14px;color:var(--muted);font-size:13px}.status.error{color:var(--bad)}.switch{display:block;text-align:center;margin-top:18px;color:var(--p);text-decoration:none;font-size:14px}.note{margin-top:20px;padding:12px;border-radius:12px;background:var(--soft);color:var(--muted);font-size:12px;line-height:1.6}@media(max-width:600px){.top{padding:15px 16px}.wrap{padding:16px;margin-top:2vh}.card{padding:24px}.back{display:none}}
</style></head>
<body><header class="top"><div class="topin"><div class="logo">E</div><div class="brand">經濟學 1–8 章｜完整題庫</div><div class="grow"></div><a class="back" href="index.html">返回登入</a></div></header><main class="wrap"><section class="card"><div class="kicker">CREATE ACCOUNT</div><h1>註冊新帳號</h1><p class="sub">建立帳號後，作答歷史與學習統計可以同步到 Firebase。</p><form id="registerForm" autocomplete="on"><div class="field"><label for="email">自訂帳號</label><input id="email" name="email" type="text" autocomplete="username" placeholder="例如：econ777" required></div><div class="field"><label for="password">設定密碼</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="6" placeholder="至少 6 碼" required></div><button class="btn" type="submit">建立帳號並開始使用</button></form><a class="switch" href="index.html">已有帳號？返回登入</a><div class="status" id="status">會員服務正在初始化……</div><div class="note">瀏覽器可依照標準帳號／密碼欄位，提供密碼儲存與自動填入。</div></section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script>
const firebaseConfig={apiKey:"AIzaSyCxPppnUG864v3E2jO1zykzFmhLpsEJCSE",authDomain:"chess-1885a.firebaseapp.com",databaseURL:"https://chess-1885a-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"chess-1885a",storageBucket:"chess-1885a.firebasestorage.app",messagingSenderId:"824383572856",appId:"1:824383572856:web:7c663d6bf0f970f6acd68d",measurementId:"G-0EMJ4W2KLS"};const statusEl=document.getElementById("status");let auth=null;function status(t,error=false){statusEl.textContent=t;statusEl.classList.toggle("error",error)}function friendly(e){const c=e?.code||"";return({"auth/email-already-in-use":"這個 Email 已經註冊過，請直接登入。","auth/invalid-email":"Email 格式不正確。","auth/weak-password":"密碼至少需要 6 碼。","auth/network-request-failed":"網路連線失敗，請稍後再試。","auth/operation-not-allowed":"Firebase 尚未開啟 Email／密碼註冊，請在 Firebase Console 開啟後再試。"}[c]||"註冊失敗，請確認資料後再試。") }function goApp(){window.location.replace("app.html")}try{firebase.initializeApp({...firebaseConfig,apiKey:"AIzaSyCxPppnUG864v3E2j1OzykzFmhLpsEJCSE"});auth=firebase.auth();auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});auth.onAuthStateChanged(user=>{if(user){localStorage.removeItem("econGuestMode");goApp()}else status("請填寫資料建立帳號。")})}catch(e){status("Firebase 尚未連線，暫時無法註冊。",true)}document.getElementById("registerForm").addEventListener("submit",async e=>{e.preventDefault();if(!auth){status("會員服務尚未連線，請稍後再試。",true);return}status("建立帳號中……");try{await auth.createUserWithEmailAndPassword(document.getElementById("email").value.trim(),document.getElementById("password").value)}catch(err){status(friendly(err),true)}});
</script><script>(function(){const i=document.getElementById("password"),b=document.createElement("button");b.type="button";b.className="btn";b.style.background="#fff7e5";b.style.color="#765621";b.style.border="1px solid #f0d28b";b.style.marginTop="0";b.style.minHeight="38px";b.textContent="顯示密碼";b.onclick=()=>{const show=i.type==="password";i.type=show?"text":"password";b.textContent=show?"隱藏密碼":"顯示密碼"};i.parentElement.appendChild(b)})();</script></body></html>
<script>(function(){const i=document.getElementById("email");if(!i)return;const l=document.querySelector('label[for="email"]');i.type="text";i.placeholder="例如：econ777";if(l)l.textContent="自訂帳號";const toAuth=v=>{const x=v.trim().toLowerCase();return x.includes("@")?x:/^[a-z0-9._-]{3,32}$/.test(x)?x+"@econ848.local":x};document.getElementById("registerForm").addEventListener("submit",()=>{const raw=i.value;i.value=toAuth(raw);setTimeout(()=>{i.value=raw},0)},true)})();</script>
<script>(function(){const i=document.getElementById("email"),l=document.querySelector('label[for="email"]');if(i){i.type="text";i.placeholder="例如：econ777";i.pattern="[A-Za-z0-9._-]{3,32}"}if(l)l.textContent="自訂帳號";const sub=document.querySelector(".card .sub");if(sub)sub.textContent="建立自訂帳號後，作答歷史與學習統計可以同步到 Firebase。";const note=document.querySelector(".note");if(note)note.textContent="請使用 3～32 個英數字、底線、句點或連字號作為自訂帳號；不要使用真實 Email 或其他重要個人資料。密碼至少 6 碼，建議使用 8 碼以上。瀏覽器可依照標準帳號／密碼欄位提供自動填入。";const f=document.getElementById("registerForm");if(f)f.addEventListener("submit",e=>{const raw=i.value.trim().toLowerCase(),ok=/^[a-z0-9._-]{3,32}$/.test(raw)||raw.endsWith("@econ848.local")&&/^[a-z0-9._-]{3,32}@econ848\\.local$/.test(raw);if(!ok){e.preventDefault();e.stopImmediatePropagation();const s=document.getElementById("status");if(s){s.textContent="請使用 3～32 個英數字、底線、句點或連字號的自訂帳號，不要使用 Email。";s.classList.add("error")}}},true)})();</script>

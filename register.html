<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>經濟學題庫｜註冊</title>
<style>
:root{--ink:#183342;--muted:#6c7f89;--line:#d9e6ea;--p:#2f8091;--soft:#edf8fa;--bad:#b74f4b}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;background:linear-gradient(135deg,#eef9fb,#fffaf2)}.top{padding:20px 24px}.topin{max-width:1080px;margin:auto;display:flex;align-items:center;gap:11px}.logo{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:var(--p);color:#fff;font-weight:900;font-size:21px}.brand{font-weight:850}.grow{flex:1}.back{color:var(--p);text-decoration:none;font-size:14px}.wrap{max-width:520px;margin:5vh auto;padding:24px}.card{border:1px solid var(--line);border-radius:24px;background:#ffffffdf;box-shadow:0 18px 55px #1f526018;padding:32px}.kicker{color:var(--p);font-size:12px;font-weight:900;letter-spacing:.16em}.card h1{font-size:31px;margin:12px 0 8px}.sub{color:var(--muted);line-height:1.7;margin:0 0 22px}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:13px;font-weight:800}.field input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit}.field input:focus{outline:3px solid #bfe5ea;border-color:var(--p)}.passwordRow{display:grid;grid-template-columns:1fr auto;gap:7px}.btn{width:100%;min-height:44px;border:1px solid transparent;border-radius:12px;background:var(--p);color:#fff;font:inherit;font-weight:800;cursor:pointer;margin-top:10px}.btn:disabled{opacity:.55;cursor:wait}.passwordToggle{width:auto;min-width:92px;margin:0;background:#fff7e5;color:#765621;border-color:#f0d28b}.status{min-height:24px;margin-top:14px;color:var(--muted);font-size:13px;line-height:1.55}.status.error{color:var(--bad)}.switch{display:block;text-align:center;margin-top:18px;color:var(--p);text-decoration:none;font-size:14px}.note{margin-top:20px;padding:12px;border-radius:12px;background:var(--soft);color:var(--muted);font-size:12px;line-height:1.7}@media(max-width:600px){.top{padding:15px 16px}.wrap{padding:16px;margin-top:2vh}.card{padding:24px}.back{display:none}.passwordRow{grid-template-columns:1fr}.passwordToggle{width:100%}}
</style></head>
<body><header class="top"><div class="topin"><div class="logo">E</div><div class="brand">經濟學 1–8 章｜完整題庫</div><div class="grow"></div><a class="back" href="index.html">返回登入</a></div></header><main class="wrap"><section class="card"><div class="kicker">CREATE ACCOUNT</div><h1>註冊新帳號</h1><p class="sub">建立自訂帳號後，作答歷史、未完成練習、統計與計算白板可同步到 Firebase。</p><form id="registerForm" autocomplete="on"><div class="field"><label for="username">自訂帳號</label><input id="username" name="username" type="text" autocomplete="username" pattern="[A-Za-z0-9._-]{3,32}" minlength="3" maxlength="32" placeholder="例如：a1a1a1 或 econ777" required></div><div class="field"><label for="password">設定密碼</label><div class="passwordRow"><input id="password" name="password" type="password" autocomplete="new-password" minlength="6" placeholder="至少 6 碼，建議 8 碼以上" required><button class="btn passwordToggle" type="button" id="togglePassword">顯示密碼</button></div></div><button class="btn" id="registerSubmit" type="submit">建立帳號並開始使用</button></form><a class="switch" href="index.html">已有帳號？返回登入</a><div class="status" id="status">會員服務正在初始化……</div><div class="note">帳號規則：3～32 個英文字母、數字、底線（_）、句點（.）或連字號（-），不可使用 Email。密碼至少 6 碼，建議 8 碼以上。密碼由 Firebase Authentication 安全處理，不會以明文寫入 Firestore。</div></section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCxPppnUG864v3E2j1OzykzFmhLpsEJCSE",authDomain:"chess-1885a.firebaseapp.com",databaseURL:"https://chess-1885a-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"chess-1885a",storageBucket:"chess-1885a.firebasestorage.app",messagingSenderId:"824383572856",appId:"1:824383572856:web:7c663d6bf0f970f6acd68d",measurementId:"G-0EMJ4W2KLS"};
const form=document.getElementById("registerForm"),usernameEl=document.getElementById("username"),passwordEl=document.getElementById("password"),statusEl=document.getElementById("status"),submitEl=document.getElementById("registerSubmit");let auth=null,creating=false;
function status(text,error=false){statusEl.textContent=text;statusEl.classList.toggle("error",error)}
function friendly(error){const code=error?.code||"";return({"auth/email-already-in-use":"此帳號名稱已有人使用。","auth/invalid-email":"Firebase 內部帳號識別碼格式錯誤。","auth/weak-password":"密碼至少需要 6 碼。","auth/network-request-failed":"網路連線失敗，請稍後再試。","auth/operation-not-allowed":"Firebase 尚未開啟帳號密碼註冊。","auth/too-many-requests":"嘗試次數過多，請稍後再試。"}[code]||`註冊失敗：${error?.message||code||"未知錯誤"}`)}
function goApp(){window.location.replace("study-home.html")}
try{firebase.initializeApp(firebaseConfig);auth=firebase.auth();auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});auth.onAuthStateChanged(user=>{if(user&&creating){localStorage.removeItem("econGuestMode");goApp()}else if(!user)status("請設定自訂帳號與密碼。")})}catch(error){status("Firebase 初始化失敗，暫時無法註冊。",true)}
form.addEventListener("submit",async event=>{event.preventDefault();const username=usernameEl.value.trim().toLowerCase(),password=passwordEl.value;if(!/^[a-z0-9._-]{3,32}$/.test(username)){status("帳號必須使用 3～32 個英文字母、數字、底線、句點或連字號，且不可使用 Email。",true);return}if(password.length<6){status("密碼至少需要 6 碼。",true);return}if(!auth){status("會員服務尚未連線，請稍後再試。",true);return}creating=true;submitEl.disabled=true;status("正在建立帳號……");try{await auth.createUserWithEmailAndPassword(username+"@econ848.local",password);sessionStorage.setItem("econ848_session_password",password);localStorage.removeItem("econGuestMode");status("帳號建立成功，正在自動登入……");goApp()}catch(error){creating=false;submitEl.disabled=false;status(friendly(error),true)}});
document.getElementById("togglePassword").onclick=event=>{const show=passwordEl.type==="password";passwordEl.type=show?"text":"password";event.currentTarget.textContent=show?"隱藏密碼":"顯示密碼"};
</script></body></html>
